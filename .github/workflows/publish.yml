name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - run: chmod +x gradlew

      - name: Gradle Publish
        run: ./gradlew publish

      - uses: actions/checkout@v5
        with:
          repository: sucj/maven-publish
          token: ${{ secrets.MAVEN_TOKEN }}
          path: ./.github/actions/publish
      - name: Publish
        uses: ./.github/actions/publish
        with:
          token: ${{ secrets.MAVEN_TOKEN }}
          
